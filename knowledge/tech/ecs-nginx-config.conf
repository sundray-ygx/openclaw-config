# Hermes Studio Nginx 反向代理配置
# 放置路径：ECS 上 nginx 的 conf.d 或 sites-enabled 目录
# 域名：hermes.ygxpro.online
# 后端：frp 映射到 ECS 本地 8648 端口 → NAS 上的 Hermes Studio

server {
    listen 80;
    server_name hermes.ygxpro.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hermes.ygxpro.online;

    # SSL 证书（替换为你实际的证书路径）
    ssl_certificate     /path/to/hermes.ygxpro.online/fullchain.pem;
    ssl_certificate_key /path/to/hermes.ygxpro.online/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 客户端请求体大小限制（上传文件用）
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # ============================================
    # 主站反向代理
    # ============================================
    location / {
        proxy_pass http://127.0.0.1:8648;
        proxy_http_version 1.1;

        # 基础代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（流式回复、终端、Kanban 实时更新都需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置（长对话、代码生成可能需要较长时间）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;

        # 缓冲关闭（流式输出需要）
        proxy_buffering off;
        proxy_cache off;
    }

    # ============================================
    # SSE / 流式回复专用（可选，部分路径可能需要特殊处理）
    # ============================================
    location ~* /api/.*(stream|chat|generate) {
        proxy_pass http://127.0.0.1:8648;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 专用头
        proxy_set_header Accept '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ============================================
# 部署步骤：
# 1. ECS 上 frps 配置：确保 8648 端口已开放（frps.toml 中 allow_ports 或默认全开）
# 2. SSL 证书：certbot 申请或上传已有证书，替换上面的路径
# 3. 将此文件放到 nginx 配置目录（如 /etc/nginx/conf.d/hermes-studio.conf）
# 4. nginx -t && nginx -s reload
# 5. 验证：访问 https://hermes.ygxpro.online
# ============================================
